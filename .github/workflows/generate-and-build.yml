name: Generate and build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  generate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # Matches "node_version" in cookiecutter.json.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install cookiecutter
        run: python -m pip install cookiecutter

      - name: Generate project from default answers
        run: cookiecutter . --no-input -o .generated

      - name: Install dependencies
        working-directory: .generated/my-ai-app
        run: npm install --no-audit --no-fund

      - name: Typecheck
        working-directory: .generated/my-ai-app
        run: npm run typecheck

      - name: Build
        working-directory: .generated/my-ai-app
        run: npm run build

      - name: Compile-check Python workers
        working-directory: .generated/my-ai-app
        run: python -m compileall -q workers/app
